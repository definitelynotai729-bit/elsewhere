name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # builds the engine and re-pins every world; the committed site must match
      - run: node tools/build.mjs
      - name: docs/ is up to date
        run: git diff --exit-code -- docs/engine.js docs/chunks docs/index.html docs/verify.js docs/verify.html docs/worlds docs/fonts docs/engines && test -z "$(git status --porcelain -- docs/engines docs/worlds docs/chunks)" || (echo "::error::docs/ is stale. Run npm run build and commit the result." && exit 1)
      # verified play: gameplay must stay deterministic and old proofs must keep verifying
      - name: Deterministic Math stays within 2 ulp of native
        run: node tools/detmath_test.mjs
      - name: Golden proofs (played in Chromium and WebKit) still verify, each on the engine it names
        run: node tools/verify.mjs tests/proofs/*.json
      - name: Engines are pinned by hash; a gameplay change leaves old proofs valid
        run: node tools/engine_test.mjs
      - name: Tampered proofs are rejected
        run: node tools/tamper_test.mjs tests/proofs/webkit-lap.json
      - name: Attacks on verified ownership are refused (SECURITY.md)
        run: node tools/attack_test.mjs
      - name: Wallets (editions, gifts, swaps) refuse double spends, replays and forgeries (ECONOMY.md)
        run: node tools/wallet_test.mjs
      - name: The ledger recomputes from its archived proofs
        run: node tools/ledger.mjs --rebuild
      - name: Random runs replay identically
        run: node tools/battery.mjs --runs 24 --ticks 600 --out "$RUNNER_TEMP/battery" && node tools/verify.mjs "$RUNNER_TEMP"/battery/*.json > /dev/null
