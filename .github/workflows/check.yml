name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # builds the engine and re-pins every world; the committed site must match
      - run: node tools/build.mjs
      - name: docs/ is up to date
        run: git diff --exit-code -- docs/engine.js docs/chunks docs/index.html docs/privacy.html docs/verify.js docs/verify.html docs/worlds docs/fonts docs/engines && test -z "$(git status --porcelain -- docs/engines docs/worlds docs/chunks)" || (echo "::error::docs/ is stale. Run npm run build and commit the result." && exit 1)
      # verified play: gameplay must stay deterministic and old proofs must keep verifying
      - name: Deterministic Math stays within 2 ulp of native
        run: node tools/detmath_test.mjs
      - name: Golden proofs (played in Chromium and WebKit, plus whole Spire Clash matches from tools/clash_sim.mjs and The Last Summer of Bronze's routes from tools/thyra_bot.mjs) still verify, each on the engine it names
        run: node tools/verify.mjs tests/proofs/*.json
      - name: Engines are pinned by hash; a gameplay change leaves old proofs valid
        run: node tools/engine_test.mjs
      - name: Tampered proofs are rejected
        run: node tools/tamper_test.mjs tests/proofs/webkit-lap.json
      - name: Attacks on verified ownership are refused (SECURITY.md)
        run: node tools/attack_test.mjs
      - name: Wallets (editions, gifts, swaps) refuse double spends, replays and forgeries (ECONOMY.md)
        run: node tools/wallet_test.mjs
      - name: The ledger recomputes from its archived proofs
        run: node tools/ledger.mjs --rebuild
      - name: Feedback is sealed to the team's key, opens only with its private half, refuses tampering, and keeps to its limits
        run: node tools/feedback_test.mjs
      - name: Played inside another site's page (itch.io upload, focus, storage, gamepad permission)
        run: node tools/embed_test.mjs
      - name: A world left behind frees its signs' textures and its own materials, and keeps what is shared
        run: node tools/free_test.mjs
      - name: "Anonymous counts: off until switched on, never a name or ID, and the privacy page in both versions"
        run: node tools/count_test.mjs
      - name: The chat and name filter catches the usual dodges and leaves everyday talk alone
        run: node tools/filter_test.mjs
      - name: Weekly challenges keep past weeks, name real records, and the published boards match
        run: node tools/challenge_test.mjs
      - name: Moving platforms carry their riders, who can walk on and off at either end (lifts and ferries)
        run: node tools/lift_test.mjs
      - name: Characters walk, follow and wait; zones and winds switch and move; the session replays exactly
        run: node tools/walk_test.mjs
      - name: Named arrivals carry through travel and replays, and the ledger refuses forged ones
        run: node tools/arrival_test.mjs
      - name: Artifacts' powers, item families and world switches work and replay exactly; a visit with a power sets no records
        run: node tools/power_test.mjs
      - name: Looks (the wardrobe's styles, faces and outfits build on every body; looks from anywhere are made safe; the look stays out of the engine and the ledger)
        run: node tools/look_test.mjs
      - name: 'Surfing the Giant (Halcyon Point: scripted riders on the real physics; a rider who does nothing is caught, holding a line makes the wave, carving scores; every ride replays)'
        run: node tools/surf_bot.mjs --out "$RUNNER_TEMP/surf" && node tools/verify.mjs "$RUNNER_TEMP"/surf/*.json > /dev/null
      - name: 'The Low Wings (Pterousa: a scripted player climbs every stack, crosses in the lulls, balances the wings, flies the Eye, steals past the guards, weaves the loom and flies the High Line; every run replays)'
        run: node tools/pterousa_bot.mjs --out "$RUNNER_TEMP/pterousa" && node tools/verify.mjs "$RUNNER_TEMP"/pterousa/*.json > /dev/null
      - name: 'Underfoot (a scripted toy-sized player finds all ten marbles, gets batted off the bed by the cat, and runs the floor is lava from the door to the window sill; every run replays)'
        run: node tools/underfoot_bot.mjs --out "$RUNNER_TEMP/underfoot" && node tools/verify.mjs "$RUNNER_TEMP"/underfoot/*.json > /dev/null
      - name: 'The Last Summer of Bronze, chapter 1 (Thyra: a scripted player takes every route, the chimney, the roof, the terraces, the boat, the race and the finale; every visit replays)'
        run: node tools/thyra_bot.mjs --out "$RUNNER_TEMP/thyra" && node tools/verify.mjs "$RUNNER_TEMP"/thyra/*.json > /dev/null
      - name: 'The Last Summer of Bronze, chapter 3 (the Strait of Teeth: a scripted player sails in, hops the Teeth, crosses the causeway between Talos''s footfalls and once under one, climbs Watch Rock, rings the bell, answers him every way, glides or walks home and sails on; every visit replays)'
        run: node tools/strait_bot.mjs --out "$RUNNER_TEMP/strait" && node tools/verify.mjs "$RUNNER_TEMP"/strait/*.json > /dev/null
      - name: 'Season 1 of the hunt (Junction: the crayon drawing in the Vault starts it after or alongside the first hunt; its five Echoes are in the world bots above)'
        run: node tools/season_bot.mjs --out "$RUNNER_TEMP/season" && node tools/verify.mjs "$RUNNER_TEMP"/season/*.json > /dev/null
      - name: Random runs replay identically
        run: node tools/battery.mjs --runs 24 --ticks 600 --out "$RUNNER_TEMP/battery" && node tools/verify.mjs "$RUNNER_TEMP"/battery/*.json > /dev/null
