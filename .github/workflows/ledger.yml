# Season-0 validator. Every 30 minutes: fetch new proofs of play from public Nostr relays, replay each one
# with the pinned world code, and append the accepted runs to docs/ledger (a hash chain). Anyone can run
# the same validator (node tools/ledger.mjs) or recompute the chain (node tools/ledger.mjs --rebuild).
name: ledger
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ledger
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Replay new runs
        run: node tools/ledger.mjs
      - name: Commit the ledger
        run: |
          if [ -z "$(git status --porcelain -- docs/ledger docs/worlds/by-hash)" ]; then echo "nothing new"; exit 0; fi
          git config user.name "elsewhere-validator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ledger docs/worlds/by-hash
          git commit -m "ledger: $(node -e "const l = require('./docs/ledger/ledger.json'); console.log('#' + l.seq + ' head ' + l.head.slice(0, 12))")"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
