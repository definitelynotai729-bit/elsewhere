<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Elsewhere</title>
<meta name="description" content="An open universe of worlds. Walk through portals, collect items that work across worlds, and meet other explorers. Prototype.">
<meta property="og:title" content="Elsewhere">
<meta property="og:description" content="An open universe of worlds. Items that work across worlds. Anyone will be able to add a world.">
<meta property="og:type" content="website">
<!--OG-->
<meta name="theme-color" content="#0b0d1f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%23ff4fd8' stroke-width='8'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%237cf6ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root {
  --ink: #e9ecff; --dim: #9aa3c8; --glass: rgba(12, 14, 34, 0.74); --glass-2: rgba(22, 26, 56, 0.82); --line: rgba(124, 246, 255, 0.22);
  --cyan: #7cf6ff; --pink: #ff4fd8; --gold: #ffd166; --good: #62e39b; --bad: #ff6b6b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d1f; color: var(--ink); font: 15px/1.45 Inter, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }
h1, h2, h3, .display { font-family: 'Chakra Petch', system-ui, sans-serif; letter-spacing: 0.02em; }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#hud-tl { position: absolute; left: max(14px, env(safe-area-inset-left)); top: 12px; }
#world-name { font: 700 22px 'Chakra Petch', sans-serif; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
#online { font-size: 13px; color: var(--dim); display: flex; gap: 6px; align-items: center; margin-top: 2px; }
#online::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
#online.alone::before { background: #6c7393; box-shadow: none; }
#online::after { content: ' here'; }
#objective { margin-top: 8px; max-width: 340px; font-size: 14px; padding: 6px 10px; border-radius: 8px; background: var(--glass); border-left: 3px solid var(--gold); display: none; }
#objective.on { display: block; }
#hud-tr { position: absolute; right: max(14px, env(safe-area-inset-right)); top: 12px; display: flex; gap: 10px; align-items: center; }
#coins { font: 700 20px 'Chakra Petch', sans-serif; color: var(--gold); background: var(--glass); padding: 4px 12px; border-radius: 20px; text-shadow: 0 0 10px rgba(255, 209, 102, .5); }
#coins.pop { animation: pop .35s ease-out; }
@keyframes pop { 40% { transform: scale(1.25); } }
#sigils { display: flex; gap: 5px; background: var(--glass); padding: 7px 10px; border-radius: 20px; }
#sigils i { width: 14px; height: 14px; transform: rotate(45deg); border: 2px solid #4b5275; display: block; }
#sigils i.got[data-s="sky"] { background: #8fd3ff; border-color: #8fd3ff; box-shadow: 0 0 10px #8fd3ff; }
#sigils i.got[data-s="deep"] { background: #3dffc5; border-color: #3dffc5; box-shadow: 0 0 10px #3dffc5; }
#sigils i.got[data-s="speed"] { background: #ff4fd8; border-color: #ff4fd8; box-shadow: 0 0 10px #ff4fd8; }
#btn-menu { pointer-events: auto; width: 40px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass); cursor: pointer; font-size: 18px; }
#abilities { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: 16px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 50vw; }
#abilities .ab { font: 600 12px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 6px; background: rgba(98, 227, 155, .18); color: var(--good); border: 1px solid rgba(98, 227, 155, .35); }
#abilities .ab.hint { background: rgba(124, 246, 255, .12); color: var(--cyan); border-color: var(--line); }
#timer { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font: 700 30px 'Chakra Petch', monospace; background: var(--glass); padding: 2px 16px; border-radius: 10px; display: none; font-variant-numeric: tabular-nums; }
#timer.on { display: block; }
#timer.final { color: var(--gold); }
#prompt { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); background: var(--glass-2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 12px; display: none; align-items: center; gap: 10px; font-weight: 600; pointer-events: auto; cursor: pointer; }
#prompt.on { display: flex; }
kbd { font: 700 12px 'Chakra Petch', sans-serif; background: var(--cyan); color: #0b0d1f; padding: 2px 7px; border-radius: 5px; }
#toasts { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; width: min(92vw, 520px); }
.toast { background: var(--glass-2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; text-align: center; animation: tin .25s ease-out; transition: opacity .4s, transform .4s; }
.toast.item { border-color: rgba(255, 209, 102, .6); color: #fff3cf; }
.toast.bad { border-color: rgba(255, 107, 107, .7); }
.toast.out { opacity: 0; transform: translateY(-8px); }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
#banner { position: absolute; top: 26%; left: 0; right: 0; text-align: center; opacity: 0; pointer-events: none; }
#banner.on { animation: banner 3.4s ease-out forwards; }
#banner h1 { margin: 0; font-size: clamp(34px, 7vw, 72px); text-transform: uppercase; letter-spacing: .08em; text-shadow: 0 0 24px rgba(124, 246, 255, .7), 0 4px 20px rgba(0,0,0,.6); }
#banner p { margin: 6px auto 0; max-width: 560px; color: #dfe4ff; font-size: 16px; text-shadow: 0 2px 10px rgba(0,0,0,.8); padding: 0 16px; }
@keyframes banner { 0% { opacity: 0; transform: translateY(14px); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }
#hint { position: absolute; right: 14px; bottom: 14px; font-size: 12px; color: var(--dim); background: rgba(12,14,34,.5); padding: 5px 9px; border-radius: 8px; }
body.touch #hint { display: none; }

/* chat */
#chat { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: 48px; width: min(420px, 70vw); }
#chat-log .line { font-size: 13.5px; padding: 2px 8px; margin-top: 2px; background: rgba(8,10,26,.55); border-radius: 6px; width: fit-content; max-width: 100%; transition: opacity 1s; overflow-wrap: anywhere; }
#chat-log .line.old { opacity: 0; }
#chat.typing .line.old { opacity: 1; }
#chat-input { display: none; pointer-events: auto; width: 100%; margin-top: 6px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--glass-2); outline: none; }
#chat.typing #chat-input { display: block; }

/* dialog */
#dialog { position: fixed; left: 50%; bottom: 7%; transform: translateX(-50%); width: min(640px, 94vw); background: var(--glass-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px 12px; z-index: 20; cursor: pointer; box-shadow: 0 10px 40px rgba(0,0,0,.5); backdrop-filter: blur(6px); }
#dialog .who { font: 700 15px 'Chakra Petch', sans-serif; color: var(--gold); text-transform: uppercase; letter-spacing: .08em; }
#dialog .text { font-size: 17px; margin-top: 4px; min-height: 2.9em; white-space: pre-wrap; }
#dialog .more { text-align: right; color: var(--cyan); font-size: 12px; animation: bob 1s infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }
#dialog .choices { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.choice { text-align: left; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(124, 246, 255, .07); cursor: pointer; }
.choice:hover, .choice:focus-visible { background: rgba(124, 246, 255, .18); }

/* panels */
#panel { position: fixed; inset: 0; z-index: 30; background: rgba(4, 5, 16, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.panel-card { width: min(860px, 100%); max-height: 88vh; display: flex; flex-direction: column; background: var(--glass-2); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.6); backdrop-filter: blur(10px); }
.panel-card header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 6px; }
.panel-card h2 { margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: .08em; }
.panel-card .close { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
.panel-body { overflow: auto; padding: 4px 18px 18px; }
.muted { color: var(--dim); } .small { font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.card img { width: 72px; height: 72px; align-self: center; }
.card .name { font: 700 16px 'Chakra Petch', sans-serif; }
.card .meta { font-size: 12px; color: var(--dim); text-transform: capitalize; }
.card .desc { font-size: 13px; flex: 1; }
.traits { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid; }
.chip.ok { color: var(--good); border-color: rgba(98, 227, 155, .4); }
.chip.off { color: var(--bad); border-color: rgba(255, 107, 107, .4); }
.btn { margin-top: 6px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(124, 246, 255, .1); cursor: pointer; font-weight: 600; }
.btn:hover:not(:disabled) { background: rgba(124, 246, 255, .22); }
.btn.on { background: rgba(98, 227, 155, .15); border-color: rgba(98, 227, 155, .45); }
.btn:disabled { opacity: .5; cursor: default; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.worlds { display: flex; flex-direction: column; gap: 8px; }
.world-row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
.wdot { width: 16px; height: 16px; border-radius: 50%; flex: none; box-shadow: 0 0 12px currentColor; }
.winfo { flex: 1; min-width: 0; }
.wname { font: 700 17px 'Chakra Petch', sans-serif; }
.wblurb { font-size: 13.5px; }
.wmeta { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
.world-row .btn { margin: 0; flex: none; }
.sec { margin-bottom: 14px; }
.sec h3 { margin: 10px 0 6px; font-size: 16px; color: var(--cyan); text-transform: uppercase; letter-spacing: .08em; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
.row select, .row input[type=range] { min-width: 140px; }
select { background: #1a1e3c; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--cyan); }
.card.run { margin-bottom: 8px; }
.card.run .meta { text-transform: none; }
.panel-body > h3 { margin: 14px 0 6px; font-size: 15px; color: var(--cyan); text-transform: uppercase; letter-spacing: .08em; }
.vres { font-size: 13px; color: var(--dim); margin-top: 4px; min-height: 1em; }
.vres.ok { color: #62e39b; }
.vres.bad { color: #ff8a9a; }
textarea.code { width: 100%; min-height: 70px; margin-top: 8px; background: #0e1030; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 12px monospace; }
a.link { color: var(--cyan); }

/* creator */
#creator { position: fixed; z-index: 40; right: 4vw; top: 50%; transform: translateY(-50%); width: min(380px, 92vw); background: var(--glass-2); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.6); backdrop-filter: blur(8px); }
#creator h2 { margin: 0 0 2px; font-size: 26px; text-transform: uppercase; letter-spacing: .08em; }
#creator label.f { display: block; margin-top: 12px; font: 600 13px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
#creator input[type=text] { width: 100%; margin-top: 4px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0e1030; outline: none; font-size: 16px; }
.swatches { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 5px; }
.sw { width: 30px; height: 30px; border-radius: 8px; border: 2px solid rgba(255,255,255,.25); cursor: pointer; }
.sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--cyan); }
#cr-go { width: 100%; margin-top: 16px; padding: 12px; font: 700 18px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: .1em; border-radius: 12px; border: none; background: linear-gradient(90deg, var(--pink), #9d7bff, var(--cyan)); color: #0b0d1f; cursor: pointer; }
.olabel { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; font-size: 13.5px; }
@media (max-width: 700px) { #creator { right: auto; left: 50%; top: auto; bottom: 10px; transform: translateX(-50%); padding: 14px; } #creator p.intro { display: none; } }

/* cabinet */
#cabinet { position: fixed; inset: 0; z-index: 35; background: rgba(4,5,16,.85); display: flex; flex-direction: column; padding: 10px; }
#cabinet .cab-top { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 10px; font: 700 18px 'Chakra Petch', sans-serif; }
#cabinet iframe { flex: 1; width: 100%; border: 1px solid var(--line); border-radius: 12px; background: #000; }

/* overlays */
#fade { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 50; mix-blend-mode: normal; }
#fade.on { opacity: 1; background: radial-gradient(circle, #ffffff 0%, #c9b6ff 45%, #0b0d1f 100%); }
#fade.flash { opacity: .7; background: #05060f; transition: opacity .12s; }
#loading { position: fixed; inset: 0; z-index: 60; background: radial-gradient(ellipse at 50% 40%, #2a1a4a 0%, #0b0d1f 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .8s; padding: 20px; text-align: center; }
#loading.gone { opacity: 0; pointer-events: none; }
#loading .logo { font: 700 clamp(40px, 9vw, 84px) 'Chakra Petch', sans-serif; letter-spacing: .14em; background: linear-gradient(90deg, var(--pink), #9d7bff, var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
#loading .ring { width: 54px; height: 54px; border-radius: 50%; border: 4px solid rgba(124,246,255,.2); border-top-color: var(--cyan); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#load-msg { color: var(--dim); max-width: 480px; }

/* touch controls */
#touch-ui { display: none; }
body.touch #touch-ui { display: block; }
#stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); display: none; z-index: 6; pointer-events: none; }
#stick.on { display: block; }
#stick-knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%; background: rgba(124,246,255,.45); transform: translate(-50%,-50%); }
.tbtn { position: fixed; z-index: 7; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); background: rgba(12,14,34,.55); color: #fff; font: 700 13px 'Chakra Petch', sans-serif; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; touch-action: none; }
.tbtn.down { background: rgba(124,246,255,.45); }
#tb-jump { right: max(22px, env(safe-area-inset-right)); bottom: 34px; width: 82px; height: 82px; font-size: 15px; }
#tb-use { right: 118px; bottom: 30px; width: 58px; height: 58px; }
#tb-board { right: 30px; bottom: 132px; width: 54px; height: 54px; }
#tb-inv { right: 96px; bottom: 112px; width: 46px; height: 46px; font-size: 11px; }
#tb-map { right: 150px; bottom: 98px; width: 46px; height: 46px; font-size: 11px; }
#tb-chat { right: 168px; bottom: 152px; width: 46px; height: 46px; font-size: 11px; }
body.busy #touch-ui .tbtn:not(#tb-chat) { opacity: .35; }
@media (max-width: 600px) { #world-name { font-size: 18px; } #hud-tr { gap: 6px; } #coins { font-size: 16px; } #chat { bottom: 150px; width: 60vw; } #objective { max-width: 60vw; font-size: 13px; } }
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="Elsewhere 3D view"></canvas>
<div id="hud">
  <div id="hud-tl"><div id="world-name"></div><div id="online" class="alone"><span id="online-n">1</span></div><div id="objective"></div></div>
  <div id="hud-tr"><div id="coins">◆ <span id="coin-n">0</span></div><div id="sigils" title="Sigils: find all three to open the Vault"><i data-s="sky"></i><i data-s="deep"></i><i data-s="speed"></i></div><button id="btn-menu" aria-label="Menu">☰</button></div>
  <div id="timer"></div>
  <div id="prompt"></div>
  <div id="toasts"></div>
  <div id="banner"><h1></h1><p></p></div>
  <div id="abilities"></div>
  <div id="chat"><div id="chat-log"></div><input id="chat-input" maxlength="140" placeholder="Say something… (Enter to send, Esc to cancel)" autocomplete="off"></div>
  <div id="hint">WASD move · Arrows camera · Space jump · E use · I items · M worlds · Enter chat · Esc menu</div>
</div>
<div id="dialog" class="hidden"><div class="who"></div><div class="text"></div><div class="choices"></div><div class="more">▼</div></div>
<div id="panel" class="hidden"><div class="panel-card"><header><h2></h2><button class="close" aria-label="Close">✕</button></header><div class="panel-body"></div></div></div>
<div id="creator" class="hidden">
  <h2>Who are you?</h2>
  <p class="intro muted small">This is how other explorers will see you. You can change it later from the menu.</p>
  <label class="f">Name<input id="cr-name" type="text" maxlength="18" placeholder="Wanderer" autocomplete="off"></label>
  <label class="f">Body</label><div class="swatches" data-part="body"></div>
  <label class="f">Head</label><div class="swatches" data-part="head"></div>
  <label class="f">Visor</label><div class="swatches" data-part="visor"></div>
  <div id="cr-first"><label class="olabel"><input id="cr-online" type="checkbox" checked><span>Show me to other players. <span class="muted">Peer-to-peer: no server, but other players can see your IP address.</span></span></label></div>
  <button id="cr-go">Enter</button>
</div>
<div id="cabinet" class="hidden"><div class="cab-top"><span class="cab-title"></span><button class="btn cab-close">✕ Close</button></div><iframe title="Arcade game" sandbox="allow-scripts allow-popups allow-pointer-lock" allow="autoplay"></iframe></div>
<div id="touch-ui">
  <div id="stick"><div id="stick-knob"></div></div>
  <div class="tbtn" id="tb-jump" data-btn="jump">JUMP</div>
  <div class="tbtn" id="tb-use" data-btn="use">USE</div>
  <div class="tbtn" id="tb-board" data-btn="board">BOARD</div>
  <div class="tbtn" id="tb-inv" data-btn="inv">ITEMS</div>
  <div class="tbtn" id="tb-map" data-btn="map">MAP</div>
  <div class="tbtn" id="tb-chat" data-btn="chat">CHAT</div>
</div>
<div id="fade"></div>
<div id="loading"><div class="logo">ELSEWHERE</div><div class="ring"></div><div id="load-msg">Loading…</div></div>
<script type="module" src="engine.js"></script>
</body>
</html>
